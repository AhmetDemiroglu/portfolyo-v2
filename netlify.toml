[build]
  command = "npm run build"
  publish = "dist"

# Vite fingerprints everything under /assets, so it can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Font filenames carry family + weight + subset and are never edited in place;
# a different face would ship under a different name.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Icons and the share image live at fixed paths, so they get a shorter window.
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Each route is prerendered to its own HTML during the build, so serve that
# instead of falling through to the SPA shell. Listed explicitly rather than
# relying on static-file precedence, so a route can never silently degrade to
# the client-rendered shell.
[[redirects]]
  from = "/about"
  to = "/about/index.html"
  status = 200

[[redirects]]
  from = "/skills"
  to = "/skills/index.html"
  status = 200

[[redirects]]
  from = "/projects"
  to = "/projects/index.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact/index.html"
  status = 200

# Anything else (deep links, 404s) still boots the app, which renders its own
# not-found route.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
