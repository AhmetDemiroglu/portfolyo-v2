[build]
  command = "npm run build"
  publish = "dist"

# Vite fingerprints everything under /assets, so it can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Font filenames carry family + weight + subset and are never edited in place;
# a different face would ship under a different name.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Icons and the share image live at fixed paths, so they get a shorter window.
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# No catch-all rewrite. Every real page is a file the build writes (index.html,
# about.html, en/index.html, en/about.html ...); any other path falls through to
# 404.html, which Netlify serves with a real 404 status. The old "/* ->
# /index.html 200" answered every made-up URL with the home page and a 200
# (soft 404), which also let crawlers spend requests on pages that do not exist.
