        <script>
            /* The queueing stubs stay synchronous so nothing the app reports before
               the vendors arrive is lost. Only the two remote scripts are held back
               until the page has settled: previously they executed during load and
               were a large share of the measured blocking time. */
            (function () {
                window.dataLayer = window.dataLayer || [];
                window.gtag = function () {
                    window.dataLayer.push(arguments);
                };
                window.gtag("js", new Date());
                window.gtag("config", "G-MFJXL2E2NV", { send_page_view: false });

                window.clarity =
                    window.clarity ||
                    function () {
                        (window.clarity.q = window.clarity.q || []).push(arguments);
                    };

                var loaded = false;
                function loadVendors() {
                    if (loaded) return;
                    loaded = true;
                    ["https://www.googletagmanager.com/gtag/js?id=G-MFJXL2E2NV",
                     "https://www.clarity.ms/tag/u10ieihl2z"].forEach(function (src) {
                        var s = document.createElement("script");
                        s.async = true;
                        s.src = src;
                        document.head.appendChild(s);
                    });
                }

                function schedule() {
                    if ("requestIdleCallback" in window) {
                        requestIdleCallback(loadVendors, { timeout: 4000 });
                    } else {
                        setTimeout(loadVendors, 2000);
                    }
                }

                if (document.readyState === "complete") schedule();
                else window.addEventListener("load", schedule, { once: true });
            })();
        </script>
