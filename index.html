        <script>
            /* Runs before first paint so the very first frame is already in the
               right theme and language. Without it, dark-mode visitors saw a
               light flash while React booted and applied the class. Must stay in
               sync with the default in ThemeContext. */
            (function () {
                var el = document.documentElement;
                try {
                    var saved = localStorage.getItem("theme");
                    el.classList.add(saved === "light" ? "light" : "dark");
                } catch (e) {
                    el.classList.add("dark");
                }
                /* The URL decides the language ("/en/about" is English, "/about"
                   Turkish). A visitor who lands on a Turkish address but chose,
                   or browses in, another language is moved to that language's
                   address here, before any module runs, so the app boots straight
                   into it. Crawlers are left where they are: every language has
                   its own URL for them, linked with hreflang. Keep the rules in
                   sync with src/seo/site.ts. */
                try {
                    var langs = ["en", "de", "es"];
                    var path = location.pathname;
                    var m = path.match(/^\/(en|de|es)(?=\/|$)/);
                    var lng = m ? m[1] : "tr";
                    if (!m) {
                        var cookie = document.cookie.match(/(?:^|;\s*)i18next=([^;]*)/);
                        var pref =
                            (cookie && decodeURIComponent(cookie[1])) ||
                            localStorage.getItem("i18nextLng");
                        if (
                            !pref &&
                            !navigator.webdriver &&
                            !/bot|crawl|spider|slurp|google|lighthouse|headless|preview|inspection/i.test(navigator.userAgent)
                        ) {
                            pref = (navigator.language || "").split("-")[0];
                        }
                        if (langs.indexOf(pref) !== -1) {
                            history.replaceState(
                                history.state,
                                "",
                                "/" + pref + path + location.search + location.hash
                            );
                            lng = pref;
                        }
                    }
                    el.lang = lng;
                } catch (e) {}
            })();
        </script>

        <script>
            /* The queueing stubs stay synchronous so nothing the app reports before
               the vendors arrive is lost. Only the two remote scripts are held back
               until the page has settled: previously they executed during load and
               were a large share of the measured blocking time. */
            (function () {
                window.dataLayer = window.dataLayer || [];
                window.gtag = function () {
                    window.dataLayer.push(arguments);
                };
                window.gtag("js", new Date());
                window.gtag("config", "G-MFJXL2E2NV", { send_page_view: false });

                window.clarity =
                    window.clarity ||
                    function () {
                        (window.clarity.q = window.clarity.q || []).push(arguments);
                    };

                var loaded = false;
                function loadVendors() {
                    if (loaded) return;
                    loaded = true;
                    ["https://www.googletagmanager.com/gtag/js?id=G-MFJXL2E2NV",
                     "https://www.clarity.ms/tag/u10ieihl2z"].forEach(function (src) {
                        var s = document.createElement("script");
                        s.async = true;
                        s.src = src;
                        document.head.appendChild(s);
                    });
                }

                function schedule() {
                    if ("requestIdleCallback" in window) {
                        requestIdleCallback(loadVendors, { timeout: 4000 });
                    } else {
                        setTimeout(loadVendors, 2000);
                    }
                }

                if (document.readyState === "complete") schedule();
                else window.addEventListener("load", schedule, { once: true });
            })();
        </script>
